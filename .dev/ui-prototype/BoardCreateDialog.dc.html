<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&amp;family=IBM+Plex+Mono:wght@400;500&amp;family=Noto+Sans+TC:wght@400;500;700&amp;display=swap">
  <style>
    *{box-sizing:border-box;}
    body{margin:0;background:#FFFFFF;font-family:'IBM Plex Sans','Noto Sans TC',sans-serif;color:#16202C;-webkit-font-smoothing:antialiased;}
    a{color:#1F4BD8;}a:hover{color:#16359B;}
    .id{font-family:'IBM Plex Mono',monospace;font-size:10px;color:#7B8896;}
    .uc{font-family:'IBM Plex Mono',monospace;font-size:10px;color:#1F4BD8;}
    .sid{font-family:'IBM Plex Mono',monospace;font-size:11px;color:#16202C;background:#DEE4EF;border-radius:3px;padding:3px 8px;}
    .warn{font-size:10px;line-height:1.55;color:#8A4B00;background:#FFF4E3;border:1px solid #EFC489;border-radius:4px;padding:3px 7px;display:inline-block;}
    .hd{height:38px;display:flex;align-items:center;gap:10px;padding:0 16px;border-bottom:1px solid #E2E6EE;background:#F7F8FA;font-size:12px;color:#5C6878;flex-shrink:0;}
    .lbl{font-size:12px;font-weight:500;color:#3B4756;display:block;margin-bottom:6px;}
    .inp{height:44px;border:1px solid #C9D0DC;border-radius:6px;background:#fff;padding:0 12px;font-size:14px;font-family:inherit;color:#16202C;width:100%;}
    .btn{height:44px;border:0;border-radius:6px;background:#1F4BD8;color:#fff;font-family:inherit;font-size:14px;font-weight:500;padding:0 18px;cursor:pointer;}
    .btn2{height:44px;border:1px solid #C9D0DC;border-radius:6px;background:#fff;color:#3B4756;font-family:inherit;font-size:14px;padding:0 18px;cursor:pointer;}
    .btnsm{height:30px;border:1px solid #C9D0DC;border-radius:5px;background:#fff;color:#3B4756;font-family:inherit;font-size:12px;padding:0 10px;cursor:pointer;}
    .err{font-size:12px;color:#A02515;background:#FDECEA;border:1px solid #F3C0B9;border-radius:6px;padding:9px 11px;}
    .av{width:26px;height:26px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:500;color:#fff;flex-shrink:0;}
  </style>
</helmet>
<div style="width: 860px; height: 800px; display: flex; flex-direction: column; background: #FFFFFF;">
<div class="hd"><span class="sid">s-board-create-dialog</span><span style="font-weight:500;color:#16202C;">建立 Board 對話框</span><span>類型：表單</span><span>狀態：已定案</span></div>
<div style="flex-grow:1;position:relative;background:#F7F8FA;overflow:hidden;">

  <div style="position:absolute;inset:0;padding:28px;opacity:.5;">
    <div style="height:44px;background:#fff;border:1px solid #E2E6EE;border-radius:6px;margin-bottom:22px;"></div>
    <div style="height:26px;width:160px;background:#E4E8EF;border-radius:4px;margin-bottom:22px;"></div>
    <div style="display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:18px;">
      <div style="height:150px;background:#fff;border:1px solid #E2E6EE;border-radius:8px;"></div>
      <div style="height:150px;background:#fff;border:1px solid #E2E6EE;border-radius:8px;"></div>
      <div style="height:150px;background:#fff;border:1px solid #E2E6EE;border-radius:8px;"></div>
      <div style="height:150px;background:#fff;border:1px solid #E2E6EE;border-radius:8px;"></div>
    </div>
  </div>
  <div style="position:absolute;inset:0;background:rgba(22,32,44,.42);"></div>

  <div style="position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:520px;background:#fff;border-radius:10px;box-shadow:0 18px 48px rgba(16,24,36,.30);overflow:hidden;">
    <div style="padding:24px 26px 6px;">
      <h2 style="margin:0 0 4px;font-size:18px;font-weight:600;">建立看板</h2>
      <p style="margin:0 0 20px;font-size:13px;color:#5C6878;">你會成為這個看板的 Owner。</p>

      <label class="lbl" for="bn">看板名稱 <span class="id">board.name</span></label>
      <input class="inp" id="bn" type="text" value="付款平台改版">
      <div class="id" style="margin-top:6px;">必填、非空</div>
    </div>
    <div style="margin-top:22px;padding:16px 26px;background:#F7F8FA;border-top:1px solid #E7EAF0;display:flex;align-items:center;gap:10px;">
      <div style="margin-right:auto;"></div>
      <button class="btn2">取消</button>
      <div style="text-align:right;">
        <button class="btn">建立看板</button>
        <div class="uc" style="margin-top:4px;">uc-create-board</div>
      </div>
    </div>
  </div>

  <div style="position:absolute;left:50%;bottom:26px;transform:translateX(-50%);width:600px;display:flex;flex-direction:column;gap:6px;align-items:flex-start;">
    <span class="id" style="color:#C8D0DE;">建立成功 → 關閉對話框，回到 s-board-list，新的 Board 顯示於列表中</span>
    <span class="id" style="color:#C8D0DE;">取消 → 關閉對話框，不建立 Board，不觸發 uc-create-board</span>
    <span class="id" style="color:#C8D0DE;">uc-create-board 無 fail 定義，本畫面無錯誤狀態</span>
  </div>
</div>
</div>
</x-dc>
<script data-dc-script data-props='{"$preview":{"width":860,"height":800}}'>
class Component extends DCLogic {
  renderVals() { return {}; }
}
</script>
</body>
</html>
